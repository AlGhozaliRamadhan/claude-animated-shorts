<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HTML timeline starter</title>
<style>
  :root {
    --ink: #0d0c0a;
    --paper: #f2ead8;
    --muted: rgba(13, 12, 10, 0.58);
    --acc: #b08a2e;
    --alert: #a33a2b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
  }

  body {
    font-family: "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  #stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--ink);
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
  }

  #stage::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(1200px 800px at 28% 18%, rgba(176, 138, 46, 0.15), transparent 68%),
      radial-gradient(900px 720px at 82% 82%, rgba(242, 234, 216, 0.055), transparent 70%);
  }

  .scene {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: none;
    align-items: center;
    justify-content: center;
  }

  /* ---------- scene 1 ---------- */

  .sheet {
    position: relative;
    width: 1320px;
    height: 760px;
    padding: 96px 110px;
    background: var(--paper);
    box-shadow: 0 48px 140px rgba(0, 0, 0, 0.55);
    will-change: transform;
  }

  .kicker {
    font-size: 24px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 54px;
  }

  h1 {
    margin: 0;
    max-width: 1040px;
    font-size: 118px;
    line-height: 0.98;
    letter-spacing: -0.035em;
    font-weight: 700;
  }

  .mark {
    position: relative;
    display: inline-block;
  }

  .mark::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 4px;
    height: 10px;
    background: var(--acc);
    transform: scaleX(var(--mark, 0));
    transform-origin: left center;
  }

  .sub {
    margin-top: 48px;
    font-size: 36px;
    line-height: 1.35;
    color: var(--muted);
    max-width: 820px;
  }

  .scene-no {
    position: absolute;
    right: 90px;
    bottom: 64px;
    font-size: 22px;
    letter-spacing: 0.18em;
    color: var(--muted);
  }

  /* ---------- scene 2 ---------- */

  .chart-wrap {
    width: 1440px;
  }

  .chart-title {
    font-size: 58px;
    letter-spacing: -0.025em;
    font-weight: 700;
    color: var(--paper);
    margin-bottom: 14px;
  }

  .chart-note {
    font-size: 24px;
    color: rgba(242, 234, 216, 0.52);
    margin-bottom: 48px;
  }

  .chart-frame {
    position: relative;
    width: 1440px;
    height: 520px;
  }

  svg.chart {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .grid line {
    stroke: rgba(242, 234, 216, 0.14);
    stroke-width: 1;
  }

  .axis line {
    stroke: rgba(242, 234, 216, 0.45);
    stroke-width: 2;
  }

  .axis text,
  .chart-label {
    fill: rgba(242, 234, 216, 0.55);
    font-size: 20px;
    font-family: "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    letter-spacing: 0.06em;
  }

  .series {
    fill: none;
    stroke: var(--acc);
    stroke-width: 7;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
  }

  .dot {
    fill: var(--paper);
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0);
  }

  .scan {
    stroke: rgba(242, 234, 216, 0.28);
    stroke-width: 1;
    opacity: 0;
  }

  /* ---------- scene 3 ---------- */

  .metric-wrap {
    width: 1320px;
  }

  .metric-label {
    font-size: 26px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(242, 234, 216, 0.55);
    margin-bottom: 18px;
  }

  .metric {
    font-size: 360px;
    line-height: 0.86;
    letter-spacing: -0.06em;
    font-weight: 700;
    color: var(--paper);
    font-variant-numeric: tabular-nums;
  }

  .metric-rule {
    width: 100%;
    height: 8px;
    background: var(--acc);
    transform: scaleX(0);
    transform-origin: left center;
    margin: 42px 0 38px;
  }

  .metric-copy {
    font-size: 38px;
    line-height: 1.3;
    color: rgba(242, 234, 216, 0.66);
    max-width: 900px;
  }

  .stamp {
    position: absolute;
    right: 140px;
    top: 150px;
    padding: 22px 30px 16px;
    border: 5px solid rgba(242, 234, 216, 0.7);
    color: rgba(242, 234, 216, 0.7);
    font-size: 34px;
    letter-spacing: 0.24em;
    font-weight: 700;
    transform: rotate(-11deg) scale(1.8);
    opacity: 0;
  }
</style>
</head>
<body>
<div id="stage">

  <section class="scene" data-start="0" data-end="4">
    <div class="sheet" data-anim="sheet">
      <div class="kicker" data-anim="kicker">Starter timeline / 01</div>
      <h1 data-anim="headline">A deterministic<br /><span class="mark" data-anim="mark">timeline</span>.</h1>
      <p class="sub" data-anim="sub">Every frame is a pure function of time. Preview it, inspect it, render it.</p>
      <div class="scene-no">0:00 / 12:00</div>
    </div>
  </section>

  <section class="scene" data-start="4" data-end="8">
    <div class="chart-wrap">
      <div class="chart-title" data-anim="chartTitle">Draw the data, not the fade.</div>
      <div class="chart-note" data-anim="chartNote">One path, one reveal, three marks landing on the beat.</div>
      <div class="chart-frame">
        <svg class="chart" viewBox="0 0 1440 520" role="img" aria-label="A line chart drawing itself">
          <g class="grid" data-anim="grid">
            <line x1="80" y1="80" x2="1360" y2="80" />
            <line x1="80" y1="200" x2="1360" y2="200" />
            <line x1="80" y1="320" x2="1360" y2="320" />
            <line x1="80" y1="440" x2="1360" y2="440" />
          </g>
          <g class="axis">
            <line x1="80" y1="440" x2="1360" y2="440" />
            <line x1="80" y1="80" x2="80" y2="440" />
            <text x="80" y="486">0</text>
            <text x="400" y="486">1</text>
            <text x="720" y="486">2</text>
            <text x="1040" y="486">3</text>
          </g>
          <path
            class="series"
            data-anim="series"
            pathLength="1"
            d="M 80 400 L 260 350 L 430 366 L 600 262 L 760 286 L 930 170 L 1100 196 L 1280 96 L 1360 118"
          />
          <g data-anim="dots">
            <circle class="dot" cx="260" cy="350" r="9" />
            <circle class="dot" cx="600" cy="262" r="9" />
            <circle class="dot" cx="930" cy="170" r="9" />
            <circle class="dot" cx="1280" cy="96" r="9" />
          </g>
          <line class="scan" data-anim="scan" x1="80" y1="80" x2="80" y2="440" />
        </svg>
      </div>
    </div>
  </section>

  <section class="scene" data-start="8" data-end="12">
    <div class="metric-wrap">
      <div class="metric-label" data-anim="metricLabel">Sample metric</div>
      <div class="metric" data-anim="metric">0.00</div>
      <div class="metric-rule" data-anim="metricRule"></div>
      <div class="metric-copy" data-anim="metricCopy">Swap the facts and the copy. Keep the timing grid.</div>
      <div class="stamp" data-anim="stamp">READY</div>
    </div>
  </section>

</div>

<script>
  const clamp01 = (value) => Math.min(1, Math.max(0, value));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeOutBack = (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);

  const scenes = Array.from(document.querySelectorAll(".scene"));

  const sceneDuration = (scene) =>
    Number(scene.dataset.end) - Number(scene.dataset.start);

  function setOpacity(el, value) {
    if (el) el.style.opacity = String(value);
  }

  function updateScene1(scene, local) {
    const enter = easeOut(clamp01(local / 1.05));
    const sheet = scene.querySelector('[data-anim="sheet"]');
    if (sheet) {
      sheet.style.transform =
        `translate(${lerp(-150, 0, enter)}px, ${lerp(70, 0, enter)}px) ` +
        `rotate(${lerp(-4.2, -1.2, enter)}deg)`;
    }

    const kicker = scene.querySelector('[data-anim="kicker"]');
    setOpacity(kicker, 0.35 + 0.65 * clamp01((local - 0.2) / 0.45));

    const headline = scene.querySelector('[data-anim="headline"]');
    if (headline) {
      const h = easeOut(clamp01((local - 0.25) / 0.85));
      headline.style.transform = `translateY(${lerp(54, 0, h)}px)`;
      setOpacity(headline, 0.25 + 0.75 * h);
    }

    const mark = scene.querySelector('[data-anim="mark"]');
    if (mark) {
      const p = easeInOut(clamp01((local - 0.95) / 0.85));
      mark.style.setProperty("--mark", String(p));
    }

    const sub = scene.querySelector('[data-anim="sub"]');
    if (sub) {
      const p = easeOut(clamp01((local - 1.15) / 0.8));
      sub.style.transform = `translateY(${lerp(26, 0, p)}px)`;
      setOpacity(sub, 0.15 + 0.85 * p);
    }
  }

  function updateScene2(scene, local) {
    const title = scene.querySelector('[data-anim="chartTitle"]');
    if (title) {
      const p = easeOut(clamp01(local / 0.8));
      setOpacity(title, 0.3 + 0.7 * p);
    }

    const note = scene.querySelector('[data-anim="chartNote"]');
    setOpacity(note, 0.2 + 0.8 * clamp01((local - 0.2) / 0.6));

    const grid = scene.querySelector('[data-anim="grid"]');
    setOpacity(grid, (0.25 + 0.75 * clamp01((local - 0.1) / 0.6)) * 0.9);

    const series = scene.querySelector('[data-anim="series"]');
    if (series) {
      const p = easeInOut(clamp01((local - 0.25) / 1.55));
      series.style.strokeDashoffset = String(1 - p);
    }

    const dots = scene.querySelectorAll(".dot");
    dots.forEach((dot, index) => {
      const p = easeOut(clamp01((local - (0.55 + index * 0.28)) / 0.35));
      dot.style.transform = `scale(${p})`;
    });

    const scan = scene.querySelector('[data-anim="scan"]');
    if (scan) {
      const p = clamp01((local - 0.2) / 2.8);
      const x = lerp(80, 1360, p);
      scan.setAttribute("x1", String(x));
      scan.setAttribute("x2", String(x));
      setOpacity(scan, p > 0 && p < 1 ? 0.7 : 0);
    }
  }

  function updateScene3(scene, local) {
    const label = scene.querySelector('[data-anim="metricLabel"]');
    setOpacity(label, 0.3 + 0.7 * clamp01((local - 0.1) / 0.45));

    const metric = scene.querySelector('[data-anim="metric"]');
    if (metric) {
      const p = easeOut(clamp01((local - 0.35) / 1.45));
      metric.textContent = (1.72 * p).toFixed(2);
      metric.style.transform = `translateY(${lerp(24, 0, p)}px)`;
    }

    const rule = scene.querySelector('[data-anim="metricRule"]');
    if (rule) {
      const p = easeInOut(clamp01((local - 0.9) / 1.15));
      rule.style.transform = `scaleX(${p})`;
    }

    const copy = scene.querySelector('[data-anim="metricCopy"]');
    if (copy) {
      const p = easeOut(clamp01((local - 1.45) / 0.8));
      copy.style.transform = `translateY(${lerp(24, 0, p)}px)`;
      setOpacity(copy, 0.15 + 0.85 * p);
    }

    const stamp = scene.querySelector('[data-anim="stamp"]');
    if (stamp) {
      const p = clamp01((local - 1.55) / 0.45);
      stamp.style.opacity = String(clamp01(p * 2));
      stamp.style.transform = `rotate(-11deg) scale(${lerp(1.8, 1, easeOutBack(p))})`;
    }
  }

  const updaters = [updateScene1, updateScene2, updateScene3];

  function apply(timeSeconds) {
    const time = Math.max(0, Math.min(window.__duration, timeSeconds));
    scenes.forEach((scene, index) => {
      const start = Number(scene.dataset.start);
      const duration = sceneDuration(scene);
      const local = time - start;
      const visible = local >= 0 && local < duration;
      scene.style.display = visible ? "flex" : "none";
      if (!visible) return;

      // Hard cuts between scenes; only the last scene fades out.
      const last = index === scenes.length - 1;
      scene.style.opacity = last ? String(clamp01((duration - local) / 0.4)) : "1";

      const update = updaters[index];
      if (update) update(scene, local);
    });
  }

  window.__duration = 12;
  window.setTime = apply;

  const stage = document.getElementById("stage");
  function fit() {
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  fit();
  window.addEventListener("resize", fit);

  // The preview harness sets window.setTime() itself. Do not fight it there.
  const params = new URLSearchParams(window.location.search);
  if (!navigator.webdriver && !params.has("still")) {
    const started = performance.now();
    const loop = (now) => {
      apply(((now - started) / 1000) % window.__duration);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  } else {
    apply(0);
  }
</script>
</body>
</html>
