<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; background: #0B0E14; overflow: hidden; }
canvas { width: 100vw; height: 100vh; display: block; }
</style>
<script src="three.min.js"></script>
</head>
<body>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1920/1080, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(1920, 1080);
document.body.appendChild(renderer.domElement);

const grid = new THREE.GridHelper(100, 50, 0x00f0ff, 0x1f2937);
grid.position.y = -2;
scene.add(grid);

const geo = new THREE.BoxGeometry(2, 2, 2);
const mat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true });
const box = new THREE.Mesh(geo, mat);
scene.add(box);

camera.position.set(0, 2, 6);
camera.lookAt(0, 0, 0);

window.renderFrame = function(t) {
    box.rotation.y = t * 0.05;
    box.rotation.x = t * 0.03;
    renderer.render(scene, camera);
};
renderFrame(10);
</script>
</body>
</html>
